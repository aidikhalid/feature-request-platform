name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — pytest against real Postgres
    runs-on: ubuntu-latest

    # The guarantees under test are a unique index and row-level locking, which only a
    # real Postgres can express. This service mirrors the db service in docker-compose.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frp
          POSTGRES_PASSWORD: frp_local_password
          POSTGRES_DB: frp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frp -d frp"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # matches api/Dockerfile
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt

      # No alembic step on purpose: tests/conftest.py appends "_test" to DATABASE_URL,
      # creates that database and migrates it with the same Alembic revisions a
      # deployment runs. Migrating here would target the wrong database.
      - name: Run tests
        working-directory: api
        env:
          DATABASE_URL: postgresql+psycopg2://frp:frp_local_password@localhost:5432/frp
        run: pytest -q

  frontend:
    name: Frontend — tests, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # matches web/Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run tests
        working-directory: web
        run: npm test

      # Kept separate from the build: `npm run build` runs `tsc -b`, which is incremental
      # and can skip typechecking entirely. `tsc --noEmit` always checks.
      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Production build
        working-directory: web
        run: npm run build
